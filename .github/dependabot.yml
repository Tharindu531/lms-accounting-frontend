version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*", "@cloudflare/*", "wrangler"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
